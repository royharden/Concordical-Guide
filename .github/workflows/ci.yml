name: CG Validation

on:
  push:
  pull_request:

jobs:
  gauntlet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install reader dependencies
        run: npm ci --prefix app --no-audit --no-fund
      - name: Run CG gauntlet
        shell: pwsh
        run: ./scripts/gauntlet.ps1
