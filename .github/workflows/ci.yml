name: CG Validation

on:
  push:
  pull_request:

jobs:
  gauntlet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run CG gauntlet
        shell: pwsh
        run: ./scripts/gauntlet.ps1
